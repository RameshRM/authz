- id: foo-view-secrets
  upstream:
    url: http://app-foo:4003
  match:
    url: http://oathkeeper:4455/foo/secrets/<[a-zA-Z0-9_-]+>
    methods:
      - GET
  authenticators:
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: http://keto:4466/relation-tuples/check
      payload: |
        {
          "namespace": "Resource",
          "object": "app:{{ index .MatchContext.RegexpCaptureGroups 0 }}",
          "relation": "view_secrets",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
      config:
        headers:
          X-User-ID: "{{ print .Subject }}"

- id: policy-foo-to-bar-all-apis
  upstream:
    url: http://api-bar:4004
  match:
    url: http://oathkeeper:4455/bar/<**>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
  authenticators:
    - handler: jwt
      config:
        required_scope:
          - bar:all
        token_from:
          header: Authorization
  authorizer:
    handler: allow
  mutators:
    - handler: header
      config:
        headers:
          X-Caller-App: "{{ print .Extra.azp }}"
          X-Acting-User: "{{ print .Subject }}"
